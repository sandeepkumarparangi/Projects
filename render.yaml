services:
  - type: web
    name: ai-resume-analyzer-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: FRONTEND_ORIGIN
        value: https://sandeepkumarparangi.github.io
